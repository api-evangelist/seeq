name: Seeq
description: >-
  Seeq is an industrial analytics, machine learning and AI software company (Seattle, WA; backed by
  Insight Partners) serving process manufacturing industries such as oil & gas, chemicals, pharmaceuticals
  & life sciences, mining & metals, power & utilities, food & beverage and semiconductors. The Seeq AI
  Platform combines operational time-series data with employee expertise and historical context to speed
  investigation, monitoring and decision-making. Programmatic access is through the Seeq Server REST API
  (served per instance at /api with an interactive Swagger surface) and the official Python modules `seeq`
  and `seeq-spy` (SPy), which offer Pandas/NumPy/Jupyter-optimized functions for searching, pulling,
  pushing and calculating on signals, conditions and asset models via Seeq Data Lab.
